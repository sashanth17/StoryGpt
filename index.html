<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Continuation Chat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#343541;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.chat-container{
    width:100%;
    max-width:900px;
    height:95vh;
    background:#202123;
    display:flex;
    flex-direction:column;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.header{
    padding:18px;
    text-align:center;
    background:#202123;
    color:white;
    font-size:22px;
    font-weight:bold;
    border-bottom:1px solid #444654;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:20px;
    background:#343541;
}

.message{
    display:flex;
    margin-bottom:18px;
}

.user{
    justify-content:flex-end;
}

.bot{
    justify-content:flex-start;
}

.bubble{
    max-width:80%;
    padding:14px 16px;
    border-radius:12px;
    line-height:1.6;
    white-space:pre-wrap;
    word-wrap:break-word;
    font-size:15px;
}

.user .bubble{
    background:#19c37d;
    color:white;
}

.bot .bubble{
    background:#444654;
    color:white;
}

.input-area{
    display:flex;
    gap:10px;
    padding:18px;
    background:#202123;
    border-top:1px solid #444654;
}

textarea{
    flex:1;
    resize:none;
    height:60px;
    border:none;
    outline:none;
    border-radius:10px;
    padding:12px;
    background:#40414f;
    color:white;
    font-size:15px;
}

button{
    width:120px;
    border:none;
    border-radius:10px;
    background:#19c37d;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#16a46a;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.typing{
    color:#aaa;
    font-style:italic;
    margin-bottom:10px;
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#666;
    border-radius:10px;
}
</style>

</head>
<body>

<div class="chat-container">

    <div class="header">
        📖 Story Continuation
    </div>

    <div id="chat" class="chat-box">

        <div class="message bot">
            <div class="bubble">
Welcome! Start a story and I'll continue it.
            </div>
        </div>

    </div>

    <div class="input-area">

        <textarea
            id="prompt"
            placeholder="Write the beginning of a story..."
        ></textarea>

        <button id="sendBtn">
            Send
        </button>

    </div>

</div>

<script>

const API_URL = "http://127.0.0.1:8000/complete";

const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, sender){

    const msg = document.createElement("div");
    msg.className = "message " + sender;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    msg.appendChild(bubble);

    chat.appendChild(msg);

    chat.scrollTop = chat.scrollHeight;

    return msg;
}

async function sendStory(){

    const prompt = promptBox.value.trim();

    if(prompt==="") return;

    addMessage(prompt,"user");

    promptBox.value="";

    sendBtn.disabled=true;

    const typing=document.createElement("div");
    typing.className="typing";
    typing.id="typing";
    typing.textContent="Generating story...";
    chat.appendChild(typing);
    chat.scrollTop=chat.scrollHeight;

    try{

        const response=await fetch(
            API_URL + "?prompt=" + encodeURIComponent(prompt),
            {
                method:"GET",
                headers:{
                    "accept":"application/json"
                }
            }
        );

        document.getElementById("typing").remove();

        if(!response.ok){
            throw new Error("HTTP "+response.status);
        }

const data = await response.json();

// Extract the story text
const story = data.output || data.response || data.story || data.text || data.completion || data.result || "No response received.";

// Display only the story
addMessage(story, "bot");

// Optional: show generation time
if (data.latency !== undefined) {
    addMessage(
        `⚡ Generated in ${(data.latency / 1000).toFixed(2)} s`,
        "bot"
    );
}

    }
    catch(err){

        if(document.getElementById("typing"))
            document.getElementById("typing").remove();

        addMessage(
            "Error: " + err.message,
            "bot"
        );
    }

    sendBtn.disabled=false;

}

sendBtn.addEventListener("click",sendStory);

promptBox.addEventListener("keydown",function(e){

    if(e.key==="Enter" && !e.shiftKey){

        e.preventDefault();

        sendStory();

    }

});

</script>

</body>
</html>
